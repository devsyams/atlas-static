[project]
name = "atlas-pipeline"
version = "0.1.0"
description = "ATLAS ingestion + AI pipeline: FastAPI ai-api, Celery worker/beat, connectors, enrichment"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.115",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
