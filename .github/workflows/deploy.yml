name: Build & Deploy (danantara)

# On every merge to main: build the image, push it to DOCR tagged with the
# commit short SHA, bump the prod overlay's image tag, and commit that back to
# main so ArgoCD redeploys. The manifest bump touches only k8s/** and is pushed
# with GITHUB_TOKEN + [skip ci], so it never re-triggers this workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**.md'
      - '.github/**'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/nexorus-registry
  IMAGE: danantara

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the manifest bump back to main
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kustomize
        run: |
          curl -sSLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          rm -f kustomize kustomize.tar.gz

      - name: Bump image tag in prod overlay
        working-directory: k8s/overlay/prod
        run: |
          kustomize edit set image \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Commit & push manifest bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- k8s/overlay/prod/kustomization.yaml; then
            echo "Overlay tag unchanged; nothing to commit."
            exit 0
          fi
          git add k8s/overlay/prod/kustomization.yaml
          git commit -m "chore(deploy): danantara image -> ${{ steps.tag.outputs.tag }} [skip ci]"
          git push origin HEAD:main
