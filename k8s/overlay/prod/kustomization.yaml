apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: registry.digitalocean.com/nexorus-registry/danantara
    newTag: v0.1.0
patches:
  - target:
      kind: Ingress
      name: danantara
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: danantara.atlas.nexorus-alpha.io
