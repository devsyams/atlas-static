apiVersion: apps/v1
kind: Deployment
metadata:
  name: danantara
  labels:
    app.kubernetes.io/name: danantara
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: danantara
  template:
    metadata:
      labels:
        app.kubernetes.io/name: danantara
    spec:
      containers:
        - name: danantara
          # tag is overridden per-overlay via kustomize `images:`
          image: registry.digitalocean.com/nexorus-registry/danantara:latest
          ports:
            - containerPort: 3000
          envFrom:
            # optional: app boots with no secrets (AI off, integrations default)
            - secretRef:
                name: danantara-env
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 250Mi
            limits:
              cpu: 750m
              memory: 500Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
